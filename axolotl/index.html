<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble's Baby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --pond:#1F6E78;
    --pond-deep:#144A52;
    --moss:#6E8F4E;
    --coral:#FF7F93;
    --sand:#D9B98A;
    --ink:#2C3B3B;
    --card:#FFFFFF;
    --shadow: 0 6px 0 rgba(44,59,59,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 10% 10%, rgba(110,143,78,0.08) 0, transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(31,110,120,0.08) 0, transparent 45%);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:6px 4px 14px;
  }
  .app{
    width:100%;
    margin:0 auto;
    max-width:780px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:34px;
    margin:0 0 22px 0;
    color:var(--ink);
    line-height:1.05;
  }
  h1 span{color:var(--pond);}

  /* ---------- Pick screen ---------- */
  .axolotl-preview{
    display:flex;
    justify-content:center;
    padding:10px 0 4px;
  }
  .axolotl-preview img{width:150px; height:auto; display:block;}

  .name-row{
    margin-top:20px;
    display:flex;
    gap:10px;
  }
  .name-row input{
    flex:1;
    border:3px solid #E7E0CE;
    border-radius:14px;
    padding:12px 14px;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    background:var(--card);
  }
  .name-row input:focus{outline:none; border-color:var(--pond);}
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    border:none;
    border-radius:14px;
    padding:12px 20px;
    cursor:pointer;
    color:#fff;
    background:var(--pond);
    box-shadow:0 5px 0 var(--pond-deep);
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pond-deep);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.wide{width:100%; margin-top:20px;}
  .btn.ghost{
    background:transparent;
    color:var(--pond);
    box-shadow:none;
    text-decoration:underline;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13px;
    padding:8px;
  }

  /* ---------- Habitat screen ---------- */
  .habitat-wrap{display:none; position:relative;}
  .habitat{
    position:relative;
    width:100%;
    aspect-ratio:445/285;
    box-shadow:var(--shadow);
    border-radius:18px;
  }
  .tank-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:0;
  }
  .sand-bed{
    position:absolute;
    left:50%;
    bottom:9%;
    width:96%;
    transform:translateX(-50%) scaleY(0.6);
    transform-origin:bottom;
    z-index:1;
    pointer-events:none;
  }
  .sand-bed img{width:100%; display:block;}
  .habitat-deco{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1;}

  .pet-swimmer{
    position:absolute;
    left:22%; top:55%;
    transform:translate(-50%,-50%);
    z-index:2;
  }
  .pet-turn{
    position:relative;
    z-index:1;
    animation:gentleTurn 3.4s ease-in-out infinite;
  }
  @keyframes gentleTurn{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }
  .pet-facing{
    display:block;
  }
  .pet-figure{
    display:block;
    width:150px; height:100px;
    object-fit:contain;
    transition:width .5s ease, height .5s ease;
  }
  .pet-name-tag{
    position:absolute; left:50%; bottom:52px; transform:translateX(-50%);
    z-index:2;
    pointer-events:none;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,0.15);
    white-space:nowrap;
  }
  .level-tag{
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:2;
    pointer-events:none;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#fff;
    background:rgba(0,0,0,0.18);
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .health-tag{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    z-index:2;
    pointer-events:none;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:12px;
    color:#fff;
    background:rgba(120, 40, 20, 0.55);
    padding:5px 12px;
    border-radius:20px;
    white-space:nowrap;
  }

  .bounce{animation:bounce .5s ease;}
  @keyframes bounce{
    0%{transform:translateY(0) scale(1);}
    30%{transform:translateY(-14px) scale(1.05);}
    55%{transform:translateY(2px) scale(0.98);}
    100%{transform:translateY(0) scale(1);}
  }
  .wiggle{animation:wiggle .55s ease;}
  @keyframes wiggle{
    0%,100%{transform:rotate(0deg);}
    20%{transform:rotate(-8deg);}
    40%{transform:rotate(7deg);}
    60%{transform:rotate(-5deg);}
    80%{transform:rotate(3deg);}
  }

  .floaty{
    position:absolute;
    font-size:26px;
    z-index:3;
    transform:translate(-50%,-50%);
    animation:floatUp 1s ease forwards;
    pointer-events:none;
  }
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,-50%) translateY(20px) scale(0.6);}
    20%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-50%) translateY(-70px) scale(1.1);}
  }

  .meter-row{
    margin-top:20px;
  }
  .meter-label{
    display:flex; justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--pond);
    margin-bottom:5px;
  }
  .meter-track{
    height:14px;
    background:#EDE7D6;
    border-radius:10px;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    background:linear-gradient(90deg, var(--moss), var(--coral));
    border-radius:10px;
    transition:width .4s ease;
    width:0%;
  }
  .stage-progress{
    margin-top:6px;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:12px;
    color:var(--ink);
    opacity:0.7;
    text-align:right;
  }

  .action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
  }
  .action-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    border:none;
    border-radius:16px;
    padding:16px 10px;
    cursor:pointer;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    transition:transform .08s ease;
  }
  .action-btn span.emoji{font-size:26px;}
  .action-btn .icon{display:flex; align-items:center; justify-content:center;}
  .action-btn.feed{background:var(--moss); box-shadow:0 5px 0 #4E6D33;}
  .action-btn.toy{background:var(--coral); box-shadow:0 5px 0 #D45A6E;}
  .action-btn:active{transform:translateY(3px); box-shadow:none !important;}

  .xp-input-row{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .xp-input{
    flex:1;
    border:3px solid #E7E0CE;
    border-radius:14px;
    padding:12px 14px;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    background:var(--card);
    min-width:0;
  }
  .xp-input:focus{outline:none; border-color:var(--pond);}
  .action-btn.xp-submit{
    background:var(--pond);
    box-shadow:0 5px 0 var(--pond-deep);
    flex-direction:row;
    padding:12px 20px;
    white-space:nowrap;
  }
  .xp-quick-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .xp-chip{
    flex:1;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    border:none;
    border-radius:12px;
    padding:8px 6px;
    cursor:pointer;
    color:var(--ink);
    background:#EDE7D6;
    transition:transform .08s ease, background .15s ease;
  }
  .xp-chip:hover{background:#E2DBC5;}
  .xp-chip:active{transform:translateY(2px);}

  .pellet{
    position:absolute;
    top:-18px;
    z-index:2;
    transform:translateX(-50%);
    pointer-events:none;
  }

  .decor-layer{ position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; z-index:1; pointer-events:none; }
  .sand-poof{
    position:absolute;
    border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:0.9;
    animation:sandPoof .65s ease-out forwards;
    pointer-events:none;
    z-index:2;
  }
  @keyframes sandPoof{
    0%{ transform:translate(-50%,-50%) translate(0,0) scale(1); opacity:0.9; }
    100%{ transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(0.4); opacity:0; }
  }
  .decor-item{
    position:absolute;
    transform:translate(-50%, -50%);
    cursor:grab;
    pointer-events:auto;
    touch-action:none;
    transition:filter .15s ease;
  }
  .decor-item:hover{
    filter:brightness(1.08) drop-shadow(0 0 6px rgba(255,255,255,0.55));
  }
  .decor-item.dragging{
    cursor:grabbing;
    z-index:5;
    filter:brightness(1.15) drop-shadow(0 0 10px rgba(255,255,255,0.75));
  }
  .decor-item.new-preview{
    opacity:0.92;
  }
  .decor-item img{
    display:block;
    height:100%;
    width:auto;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.18));
    pointer-events:none;
  }
  .decor-sway{
    animation:decorSway 3.2s ease-in-out infinite;
  }
  @keyframes decorSway{
    0%,100%{ transform:translateX(-50%) rotate(-3deg); }
    50%{ transform:translateX(-50%) rotate(3deg); }
  }

  .habitat.placing{ cursor:crosshair; }
  .habitat.placing .pet-swimmer,
  .habitat.placing .decor-item{ pointer-events:none; }
  .placement-banner{
    display:none;
    position:absolute;
    left:50%; top:10px;
    transform:translateX(-50%);
    z-index:11;
    background:rgba(20,35,35,0.82);
    color:#fff;
    padding:8px 14px;
    border-radius:14px;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13px;
    align-items:center;
    gap:10px;
    white-space:nowrap;
    box-shadow:var(--shadow);
  }
  .placement-banner.show{ display:flex; }
  .placement-center-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    border:none;
    border-radius:10px;
    padding:5px 10px;
    cursor:pointer;
    color:var(--ink);
    background:#fff;
  }
  .milestone-overlay{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(20,35,35,0.6);
    align-items:center;
    justify-content:center;
    z-index:10;
    border-radius:18px;
    padding:20px;
  }
  .milestone-card{
    background:var(--card);
    border-radius:20px;
    padding:26px 22px;
    text-align:center;
    max-width:300px;
    box-shadow:var(--shadow);
  }
  .milestone-card h3{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:22px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .milestone-card p{
    font-family:'Nunito', sans-serif;
    font-size:14px;
    color:var(--ink);
    opacity:0.75;
    margin:0 0 18px;
  }
  .calendar-box{
    max-width:320px;
    text-align:left;
    max-height:80vh;
    overflow-y:auto;
  }
  .calendar-box h3{text-align:center;}
  .calendar-sub{font-size:13px !important; text-align:center;}
  .calendar-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
    max-height:180px;
    overflow-y:auto;
  }
  .calendar-list-empty{
    font-family:'Nunito', sans-serif;
    font-size:13px;
    color:var(--ink);
    opacity:0.55;
    text-align:center;
    padding:8px 0;
  }
  .calendar-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:#F3EFE1;
    border-radius:12px;
    padding:8px 10px;
  }
  .calendar-item-info{
    font-family:'Nunito', sans-serif;
    font-size:13px;
    color:var(--ink);
    line-height:1.3;
  }
  .calendar-item-info b{display:block; font-size:13px;}
  .calendar-item-info span{opacity:0.65; font-size:12px;}
  .calendar-item-remove{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    border:none;
    border-radius:10px;
    padding:6px 10px;
    cursor:pointer;
    color:#fff;
    background:var(--coral);
    flex-shrink:0;
  }
  .calendar-form{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding-top:12px;
    border-top:2px solid #EDE7D6;
  }
  .calendar-form .xp-input{font-size:14px; padding:10px 12px;}
  .calendar-dates{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .calendar-dates .xp-input{flex:1; min-width:0;}
  .calendar-dates span{font-size:13px; color:var(--ink); opacity:0.7;}
  .milestone-choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .milestone-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:14px;
    padding:14px;
    cursor:pointer;
    color:#fff;
    background:var(--pond);
    box-shadow:0 4px 0 var(--pond-deep);
    transition:transform .08s ease;
  }
  .milestone-btn.alt{ background:var(--coral); box-shadow:0 4px 0 #D45A6E; }
  .milestone-btn:active{ transform:translateY(3px); box-shadow:none; }

  .color-choices{
    display:none;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .color-swatch-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    border:none;
    border-radius:14px;
    padding:8px 4px 10px;
    cursor:pointer;
    color:var(--ink);
    background:#fff;
    box-shadow:0 4px 0 #D8DEDE;
    transition:transform .08s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .color-swatch-btn img{
    width:48px;
    height:auto;
    pointer-events:none;
  }
  .color-swatch-btn:active{ transform:translateY(3px); box-shadow:none; }

  .furniture-choices{
    display:none;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    max-height:280px;
    overflow-y:auto;
    padding-right:2px;
  }

  .toy-el{
    position:absolute;
    z-index:3;
    pointer-events:none;
    transform:translate(-50%,-50%);
  }
  .toy-beach_ball{ width:12%; }
  .toy-starfish{ width:13%; }
  .toy-purple_jellyfish{ width:14%; }
  .toy-rubber_duck{ width:13%; }
  .toy-shell_starfish_charm{ width:14%; transform:translate(-50%,0%); transform-origin:top center; }

  .ride-toy{
    position:absolute;
    left:50%;
    top:58%;
    width:190%;
    z-index:0;
    animation:raftSpin 6s linear infinite;
  }
  @keyframes raftSpin{
    from{ transform:translate(-50%,-50%) rotate(0deg); }
    to{ transform:translate(-50%,-50%) rotate(360deg); }
  }

  .charm-sway{ animation:charmSway 1.6s ease-in-out infinite; }
  @keyframes charmSway{
    0%,100%{ transform:translate(-50%,0%) rotate(-6deg); }
    50%{ transform:translate(-50%,0%) rotate(6deg); }
  }
  .charm-boop{ animation:charmBoop 0.5s ease-in-out 2; }
  @keyframes charmBoop{
    0%,100%{ transform:translate(-50%,0%) rotate(-8deg); }
    50%{ transform:translate(-50%,0%) rotate(24deg); }
  }

  .stats-row{
    margin-top:16px;
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--ink);
    opacity:.75;
  }

  .footer-links{
    margin-top:16px;
    text-align:center;
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
  }

  .visually-hidden{display:none;}
  /* ---------- Companion Keep (Nov 4) ---------- */
  .ck-today{margin-top:14px; background:var(--card); border:3px solid #E7E0CE; border-radius:16px; padding:12px 14px; font-size:14px;}
  .ck-today b{font-family:'Baloo 2', sans-serif;}
  .ck-rule{font-size:13px; opacity:.75; margin:0 0 8px;}
  .ck-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .ck-chip{border-radius:999px; padding:4px 10px; background:#F1ECDD; font-weight:700; font-size:13px;}
  .ck-chip.ok{background:#DDF0D2; color:#2F5E1E;}
  .ck-fed{margin-top:8px; font-weight:800; color:var(--pond);}
  .ck-grown{margin-top:14px; background:#FFF6DA; border:3px solid #F1D98A; border-radius:16px; padding:14px; text-align:center;}
  .ck-grown h3{font-family:'Baloo 2', sans-serif; margin:0 0 4px; font-size:20px;}
  .ck-grown p{margin:0 0 10px; font-size:14px;}
  .ck-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .ck-album{margin-top:14px; font-size:13px; text-align:center; opacity:.85;}
  .ck-album span{display:inline-block; background:#F1ECDD; border-radius:999px; padding:3px 10px; margin:3px; font-weight:700;}
  .ck-new{margin-top:12px; text-align:center;}
  .ck-loading{text-align:center; padding:40px 0; font-weight:700; opacity:.7;}
</style>
</head>
<body>
<div class="app">
  <h1 id="main-heading" style="display:none;">Name your <span>baby axolotl</span></h1>
  <div class="ck-loading" id="ck-loading">Waking up your axolotl…</div>

  <div id="pick-screen" style="display:none;">
    <div class="axolotl-preview" id="axolotl-preview"></div>
    <div class="name-row">
      <input id="pet-name-input" type="text" placeholder="Give your axolotl a name" maxlength="18">
    </div>
    <button class="btn wide" id="confirm-btn" disabled>Welcome your axolotl</button>
    <div class="ck-album" id="ck-album-pick"></div>
  </div>

  <div class="habitat-wrap" id="habitat-wrap" style="display:none;">
    <div class="habitat" id="habitat">
      <img class="tank-bg" id="tank-bg" alt="">
      <div class="sand-bed"><img id="sand-bed-img" alt=""></div>
      <div class="decor-layer" id="decor-layer"></div>
      <div class="habitat-deco" id="habitat-deco"></div>
      <div class="pet-swimmer" id="pet-swimmer">
        <div class="pet-turn" id="pet-turn">
          <div class="pet-facing" id="pet-facing">
            <img class="pet-figure" id="pet-figure" alt="Your axolotl">
          </div>
        </div>
      </div>
      <div class="pet-name-tag" id="pet-name-tag"></div>
      <div class="level-tag" id="level-tag"></div>
      <div class="health-tag" id="health-tag" style="display:none;"></div>
      <div class="placement-banner" id="placement-banner">
        <span id="placement-banner-text">Tap the tank to place it</span>
        <button class="placement-center-btn" id="placement-center-btn">Center it for me</button>
      </div>
    </div>

    <div class="milestone-overlay" id="milestone-overlay">
      <div class="milestone-card">
        <h3 id="milestone-heading">Level up!</h3>
        <p id="milestone-subtext">Pick a reward for your axolotl:</p>
        <div class="color-choices" id="color-choices"></div>
        <div class="furniture-choices" id="furniture-choices"></div>
      </div>
    </div>

    <div class="meter-row">
      <div class="meter-label"><span>Growing</span><span id="meter-text"></span></div>
      <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
      <div class="stage-progress" id="stage-progress"></div>
    </div>

    <div class="ck-today" id="ck-today"></div>
    <div id="ck-grown-box"></div>

    <div class="stats-row">
      <span id="fed-count">Fed 0 times</span>
      <span id="toy-count">Toys earned: 0</span>
    </div>
    <div class="ck-album" id="ck-album"></div>
  </div>
</div>




<script>
let swimTimer = null;
let currentFrameIdx = 0;
let busy = false;
let isTurning = false;
let facingLeft = false;
let lastLeftPx = null;

// Picks a random toy, but never the same one that was just given - and
// remembers that choice in saved state so a page reload can't repeat it
// either.
function pickNextToy(){
  const lastKey = state ? state.lastToyKey : null;
  const pool = TOYS.filter(t => t.key !== lastKey);
  const choices = pool.length ? pool : TOYS;
  const toy = choices[Math.floor(Math.random() * choices.length)];
  if(state) state.lastToyKey = toy.key;
  return toy;
}

function decoBubbles(){
  let out = '';
  for(let i=0;i<6;i++){
    const left = 5 + Math.random()*90;
    const size = 6 + Math.random()*10;
    const delay = Math.random()*3;
    out += `<div style="position:absolute; left:${left}%; bottom:-20px; width:${size}px; height:${size}px; border-radius:50%; background:rgba(255,255,255,0.35); animation:rise 5s linear infinite; animation-delay:${delay}s;"></div>`;
  }
  return out + `<style>@keyframes rise{0%{transform:translateY(0); opacity:0;}10%{opacity:1;}100%{transform:translateY(-220px); opacity:0;}}</style>`;
}

// Levels (not raw feed counts) now drive growth: every LEVEL_XP worth of XP
// sent in completes one level, which is what used to be one "feed."
const LEVEL_XP = 3500;
// For migrating a save from before this system existed - old saves counted
// whole feeds, 10 of which used to span one growth stage (matching STAGES
// being spaced 10 apart), so this preserves that same proportional progress.
const LEGACY_XP_PER_FEED = LEVEL_XP / 10;
const AXOLOTL_ASPECT = 1.5;
// The stage sizes below were tuned against a tank rendered at roughly this
// many pixels wide. On a narrower screen the tank itself shrinks (it's
// width:100% up to that max), but a fixed-pixel pet size would not - making
// it look oversized and able to swim past the glass. Scaling by the tank's
// actual current width keeps the pet proportional at any screen size.
const PET_DESIGN_WIDTH = 780;
let currentStage = null;

function applyPetSize(stage){
  currentStage = stage;
  const habitat = document.getElementById('habitat');
  const figureEl = document.getElementById('pet-figure');
  const habitatWidth = habitat.getBoundingClientRect().width || PET_DESIGN_WIDTH;
  const scale = habitatWidth / PET_DESIGN_WIDTH;
  const height = Math.round(stage.size * scale);
  const width = Math.round(stage.size * AXOLOTL_ASPECT * scale);
  figureEl.style.width = width + 'px';
  figureEl.style.height = height + 'px';
}

window.addEventListener('resize', () => {
  if(currentStage) applyPetSize(currentStage);
});

// Every few post-max levels the tank itself grows a bit (see TANK_GROWTH_EVERY
// in addXP()). Widening the whole app container keeps everything - tank,
// buttons, text - scaling together instead of the tank overflowing its card.
function applyTankSize(){
  const level = (state && state.tankLevel) || 0;
  const maxWidth = TANK_BASE_MAX_WIDTH + level * TANK_GROWTH_STEP;
  const appEl = document.querySelector('.app');
  if(appEl) appEl.style.maxWidth = maxWidth + 'px';
}

// The tank artwork's waterline sits a bit below the top of the glass (there's
// rim/empty space above it), not at 0%. Keep the pet's top edge below this so
// it never visually pokes above the water, no matter how big it's grown.
const WATER_SURFACE_PCT = 19;

function getPetHalfHeightPct(){
  const habitat = document.getElementById('habitat');
  const figure = document.getElementById('pet-figure');
  const hRect = habitat.getBoundingClientRect();
  const fRect = figure.getBoundingClientRect();
  if(!hRect.height) return 12;
  return (fRect.height / 2) / hRect.height * 100;
}

function getColorPack(){
  if(!state) return PALETTES[0];
  return PALETTES[state.paletteIndex || 0];
}

// How long since the pet was last fed (any XP added counts as feeding).
// 1 day in: swimming just slows down. 2 days in: it settles on the sand and
// looks visibly under the weather, until fed again.
const LOW_HEALTH_MS = 24 * 60 * 60 * 1000;
const SICK_MS = 2 * 24 * 60 * 60 * 1000;
// Companion Keep (Nov 4): weekends, school breaks and excused days are worked out by Companion Keep from the real
// school calendar, and it sends the result here (ckHealth). Nothing is kept in this browser.
let ckHealth = 'ok';
function escH(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getHealthStatus(){
  if(!state || !state.name) return 'ok';
  return ckHealth;
}

// The palette filter plus a desaturated, dimmed look layered on top once the
// pet is sick - combined carefully since CSS's "none" keyword can't be
// chained with other filter functions.
function getDisplayFilter(){
  const base = getColorPack().filter;
  if(getHealthStatus() !== 'sick') return base;
  const sickFilter = 'grayscale(0.55) brightness(0.8) saturate(0.5)';
  return (base && base !== 'none') ? (base + ' ' + sickFilter) : sickFilter;
}

function setHappyFrame(figureEl){
  const pack = getColorPack();
  if(pack.happyFrame){
    figureEl.style.filter = 'none';
    figureEl.src = pack.happyFrame;
  } else {
    figureEl.style.filter = getDisplayFilter();
    figureEl.src = FRAMES[TOY_FRAME];
  }
}

function stageIndexFor(points){
  let idx = 0;
  STAGES.forEach((s, i) => { if(points >= s.min) idx = i; });
  return idx;
}

let state = null;

function fillState(){
  if(!state) return;
  if(state.totalXP === undefined) state.totalXP = 0;
  const currentLevel = Math.floor(state.totalXP / LEVEL_XP);
  if(state.unlockedStageIndex === undefined) state.unlockedStageIndex = stageIndexFor(currentLevel);
  if(!state.decorations) state.decorations = [];
  if(!state.decorPositions) state.decorPositions = {};
  if(state.paletteIndex === undefined) state.paletteIndex = 0;
  if(state.postMaxMilestoneCount === undefined) state.postMaxMilestoneCount = 0;
  if(state.tankLevel === undefined) state.tankLevel = 0;
  if(state.toysGiven === undefined) state.toysGiven = 0;
  if(state.lastToyKey === undefined) state.lastToyKey = null;
  if(state.timesFed === undefined) state.timesFed = 0;
  if(state.fed === undefined) state.fed = 0;
  if(!state.past) state.past = [];
}
async function saveState(){
  if(!state) return;
  try{ parent.postMessage({ type: 'ck-save', state: JSON.parse(JSON.stringify(state)) }, location.origin); }
  catch(e){ console.error('Could not save the axolotl', e); }
}

function stageFor(points){
  let current = STAGES[0];
  for(const s of STAGES){ if(points >= s.min) current = s; }
  return current;
}
function nextThreshold(points){
  for(const s of STAGES){ if(points < s.min) return s.min; }
  return STAGES[STAGES.length-1].min;
}

function paintHabitat(){
  const pet = PETS[state.petType];
  const totalXP = state.totalXP || 0;
  const points = Math.floor(totalXP / LEVEL_XP);
  const stage = stageFor(points);
  const stageIndex = STAGES.indexOf(stage);

  const habitat = document.getElementById('habitat');

  applyTankSize();
  document.getElementById('habitat-deco').innerHTML = pet.decoBuilder();

  applyPetSize(stage);
  document.getElementById('pet-figure').style.filter = getDisplayFilter();
  ensureSwimCycle();

  const decorLayer = document.getElementById('decor-layer');
  decorLayer.innerHTML = '';
  (state.decorations || []).forEach((key, idx) => {
    const item = FURNITURE_CATALOG.find(f => f.key === key);
    const pos = (state.decorPositions && state.decorPositions[key]) || DECOR_SLOT_POSITIONS[idx];
    if(!item || !pos) return;
    const variantKey = (state.decorVariants || {})[key];
    const variant = item.variants && item.variants.find(v => v.key === variantKey);
    const div = document.createElement('div');
    div.className = 'decor-item' + (item.kind === 'plant' ? ' decor-sway' : '');
    div.style.left = pos.left;
    div.style.height = pos.height;
    const heightPct = parseFloat(pos.height) || 30;
    const leftPct = parseFloat(pos.left) || 50;
    // Older saved positions (from before free placement) only stored a left
    // and height - fall back to a sand-seated default in that case.
    const topPct = pos.top ? parseFloat(pos.top) : defaultTopPercentFor(leftPct, 0, heightPct);
    div.style.top = topPct + '%';
    div.title = 'Drag to move';
    attachDragHandlers(div, key, false);
    const img = document.createElement('img');
    img.alt = item.label;
    img.onload = () => clampDecorToTank(div, img);
    img.src = variant ? variant.img : item.img;
    div.appendChild(img);
    decorLayer.appendChild(div);
  });

  currentWanderSpeed = pet.wanderSpeed;
  startWanderLoop();

  document.getElementById('pet-name-tag').textContent = state.name;
  document.getElementById('level-tag').textContent = stage.label;

  const healthTag = document.getElementById('health-tag');
  const health = getHealthStatus();
  if(health === 'sick'){
    healthTag.textContent = `${state.name} is sick! Hit 120 XP with your 3 subjects to feed it.`;
    healthTag.style.display = 'block';
  } else if(health === 'tired'){
    healthTag.textContent = `${state.name} is hungry and slow today`;
    healthTag.style.display = 'block';
  } else {
    healthTag.style.display = 'none';
  }

  const isMaxStage = stageIndex === STAGES.length - 1;
  const stageProgress = document.getElementById('stage-progress');
  let pct, meterTxt;
  if(isMaxStage){
    const past = points - stage.min, into = past % POST_MAX_LEVEL_INTERVAL;
    pct = Math.round(into / POST_MAX_LEVEL_INTERVAL * 100);
    meterTxt = 'Level ' + points + ' \u00b7 fully grown';
    stageProgress.textContent = (state.decorations || []).length < MAX_DECOR ? (POST_MAX_LEVEL_INTERVAL - into) + ' more feed' + (POST_MAX_LEVEL_INTERVAL - into === 1 ? '' : 's') + ' to find a new decoration' : 'The tank is full of treasures!';
  } else {
    const levelsIntoStage = points - stage.min;
    const levelsNeeded = STAGES[stageIndex + 1].min - stage.min;
    pct = Math.round(levelsIntoStage / levelsNeeded * 100);
    meterTxt = 'Level ' + points;
    const left = levelsNeeded - levelsIntoStage;
    stageProgress.textContent = left + ' more feed' + (left === 1 ? '' : 's') + ' until ' + state.name + ' grows into a ' + STAGES[stageIndex + 1].label + '!';
  }
  document.getElementById('meter-fill').style.width = pct + '%';
  document.getElementById('meter-text').textContent = meterTxt;
  paintCK(isMaxStage);

  document.getElementById('fed-count').textContent = `Fed ${state.timesFed || 0} time${state.timesFed === 1 ? '' : 's'}`;
  document.getElementById('toy-count').textContent = `Toys earned: ${state.toysGiven || 0}`;
}

// Maps a horizontal position (0-100, relative to the tank) to how high the
// sand actually sits there, since the sand bed is a wavy mound rather than a
// flat line. Sampled from the sand artwork itself at 101 points across its
// width. Lets decorations rest right on the sand surface wherever they land,
// instead of floating above a peak or sinking below a valley.
const SAND_HEIGHT_TABLE = [0.6333,0.6333,0.7933,0.86,0.9,0.92,0.9267,0.9333,0.9267,0.9133,0.9,0.88,0.8533,0.8267,0.8,0.7733,0.7533,0.74,0.7267,0.7133,0.7,0.6933,0.6867,0.68,0.6667,0.66,0.6533,0.6467,0.6467,0.6467,0.6467,0.6533,0.66,0.6667,0.68,0.6933,0.7067,0.7267,0.74,0.76,0.78,0.8,0.8267,0.84,0.8667,0.88,0.9,0.9067,0.9133,0.92,0.92,0.9133,0.9067,0.9,0.88,0.8667,0.8467,0.8267,0.8,0.78,0.76,0.74,0.7267,0.7133,0.7,0.6933,0.6867,0.68,0.68,0.68,0.68,0.6867,0.6933,0.7,0.72,0.7333,0.7467,0.7667,0.78,0.8,0.82,0.8467,0.86,0.88,0.8867,0.9,0.9067,0.9067,0.9067,0.9,0.8933,0.8733,0.86,0.84,0.8267,0.8,0.7733,0.7533,0.7267,0.6867,0.6];
const SAND_VISUAL_HEIGHT_PCT = 20.75; // sand mound's visual height as % of tank height
const SAND_BOTTOM_PCT = 9; // where the sand layer itself is anchored, % from tank bottom

function sandBottomPercentAt(leftPct, widthPct){
  // For wide items, matching only the center point can leave the flanks
  // visibly above or below the sand if the wave curves within the item's own
  // width - so average the sand height across the item's actual span instead.
  const halfW = (widthPct || 0) / 2;
  const samplePoints = halfW > 2
    ? [leftPct - halfW, leftPct - halfW / 2, leftPct, leftPct + halfW / 2, leftPct + halfW]
    : [leftPct];
  let total = 0;
  for(const lp of samplePoints){
    const sandFrac = Math.min(1, Math.max(0, (lp - 2) / 96));
    const idx = Math.round(sandFrac * 100);
    total += SAND_HEIGHT_TABLE[idx];
  }
  const heightFrac = total / samplePoints.length;
  return SAND_BOTTOM_PCT + SAND_VISUAL_HEIGHT_PCT * heightFrac;
}

// Every decoration is freely draggable in any direction now, but a brand new
// one still needs a sensible starting spot - resting on the sand at its
// horizontal position reads much better than dropping it in mid-water.
function defaultTopPercentFor(leftPct, widthPct, heightPct){
  const bottomPct = sandBottomPercentAt(leftPct, widthPct);
  return 100 - bottomPct - heightPct / 2;
}

// Keeps a placed decoration from poking out past the edges of the tank,
// no matter how wide the art is or where it was originally placed.
function clampDecorToTank(div, img){
  const habitat = document.getElementById('habitat');
  if(!habitat) return;
  const habRect = habitat.getBoundingClientRect();
  if(!habRect.width || !habRect.height) return;

  const heightPct = parseFloat(div.style.height) || 30;
  const itemHeightPx = habRect.height * (heightPct / 100);
  const ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 1;
  const itemWidthPx = itemHeightPx * ratio;
  const halfWidthPct = (itemWidthPx / 2 / habRect.width) * 100;
  // The sand floor itself is inset from the tank's outer edges (it's drawn at
  // 96% width, centered), and the glass side walls take up a bit more room
  // on top of that - so decorations need a wider safety margin than just a
  // couple percent, or they visually sit on/past the glass instead of on the sand.
  const margin = 7;

  let leftPct = parseFloat(div.style.left);
  if(isNaN(leftPct)) leftPct = 50;

  const min = halfWidthPct + margin;
  const max = 100 - halfWidthPct - margin;
  if(min < max){
    leftPct = Math.min(Math.max(leftPct, min), max);
  } else {
    leftPct = 50;
  }
  div.style.left = leftPct + '%';
}

// Used only for a brand-new placement preview, right after its image loads
// and we finally know its real aspect ratio - refines the default vertical
// spot using the item's actual width, so wide items start seated properly
// instead of guessed from a placeholder position. Once the person drops or
// drags it, that stored top is the source of truth and this never runs again.
function refineNewPreviewPosition(div, img){
  clampDecorToTank(div, img);
  const habitat = document.getElementById('habitat');
  const habRect = habitat.getBoundingClientRect();
  if(!habRect.width || !habRect.height) return;
  const heightPct = parseFloat(div.style.height) || 30;
  const itemHeightPx = habRect.height * (heightPct / 100);
  const ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 1;
  const itemWidthPx = itemHeightPx * ratio;
  const widthPct = (itemWidthPx / habRect.width) * 100;
  const leftPct = parseFloat(div.style.left) || 50;
  div.style.top = defaultTopPercentFor(leftPct, widthPct, heightPct) + '%';
}

function ensureSwimCycle(){
  if(!swimTimer){
    const figure = document.getElementById('pet-figure');
    if(!figure.getAttribute('src')){
      figure.src = FRAMES[SWIM_SEQUENCE[0]];
      figure.style.filter = getDisplayFilter();
    }
    swimTimer = setInterval(() => {
      if(busy || isTurning || isResting) return;
      currentFrameIdx = (currentFrameIdx + 1) % SWIM_SEQUENCE.length;
      const figureEl = document.getElementById('pet-figure');
      figureEl.src = FRAMES[SWIM_SEQUENCE[currentFrameIdx]];
      figureEl.style.filter = getDisplayFilter();
    }, 160);
  }
  if(!directionTrackerStarted){
    directionTrackerStarted = true;
    requestAnimationFrame(trackDirection);
  }
}

const REST_CHANCE = 0.25;

function pickRestSpot(){
  const placed = (state && state.decorations) || [];
  // Sometimes head for a placed hide/decoration, otherwise just settle on open sand.
  if(placed.length && Math.random() < 0.65){
    const idx = Math.floor(Math.random() * placed.length);
    const key = placed[idx];
    const pos = (state.decorPositions && state.decorPositions[key]) || DECOR_SLOT_POSITIONS[idx];
    if(pos){
      const anchorLeft = parseFloat(pos.left);
      const left = Math.max(10, Math.min(88, anchorLeft + (Math.random() * 10 - 5)));
      return { left, top: 74 + Math.random() * 10 };
    }
  }
  return { left: 15 + Math.random() * 68, top: 76 + Math.random() * 9 };
}

function startWanderLoop(){
  if(wanderTimer) return;
  const swimmer = document.getElementById('pet-swimmer');

  function settleToRest(){
    isResting = true;
    pauseSwimming();
    const figure = document.getElementById('pet-figure');
    figure.style.filter = getDisplayFilter();
    figure.src = FRAMES[SWIM_SEQUENCE[0]];
    const sick = getHealthStatus() === 'sick';
    const restDuration = sick ? (8000 + Math.random() * 6000) : (2600 + Math.random() * 3800);
    wanderTimer = setTimeout(() => {
      isResting = false;
      lastLeftPx = null;
      resumeSwimming();
      nextLeg();
    }, restDuration);
  }

  function nextLeg(){
    if((busy && !isRiding) || isTurning || isResting){
      wanderTimer = setTimeout(nextLeg, 300);
      return;
    }
    const currentLeft = parseFloat(swimmer.style.left) || 22;
    const currentTop = parseFloat(swimmer.style.top) || 55;

    const health = getHealthStatus();
    // Under the weather: swims noticeably slower, and once truly sick it
    // heads for the sand and stays there instead of wandering normally.
    const speedMultiplier = health === 'sick' ? 4 : (health === 'tired' ? 2.5 : 1);
    const shouldRest = health === 'sick' || Math.random() < REST_CHANCE;

    if(shouldRest){
      const spot = pickRestSpot();
      const dist = Math.hypot(spot.left - currentLeft, spot.top - currentTop);
      const duration = Math.max(1400, dist * currentWanderSpeed * 12 * speedMultiplier);

      swimmer.style.transition = `left ${duration}ms ease-in-out, top ${duration}ms ease-in-out`;
      swimmer.style.left = spot.left + '%';
      swimmer.style.top = spot.top + '%';

      wanderTimer = setTimeout(settleToRest, duration);
      return;
    }

    const targetLeft = 15 + Math.random() * 68;
    const minTop = Math.min(WATER_SURFACE_PCT + getPetHalfHeightPct(), 65);
    const targetTop = minTop + Math.random() * (74 - minTop);
    const dist = Math.hypot(targetLeft - currentLeft, targetTop - currentTop);
    const duration = Math.max(1400, dist * currentWanderSpeed * 12 * speedMultiplier);

    swimmer.style.transition = `left ${duration}ms ease-in-out, top ${duration}ms ease-in-out`;
    swimmer.style.left = targetLeft + '%';
    swimmer.style.top = targetTop + '%';

    wanderTimer = setTimeout(nextLeg, duration);
  }
  nextLeg();
}

// Called when a sick pet gets fed - a long "lying on the sand" rest might
// already be scheduled, so cut that short and get it moving again right away
// instead of waiting for that timer to run out on its own.
function wakeFromSickness(){
  if(wanderTimer){ clearTimeout(wanderTimer); wanderTimer = null; }
  isResting = false;
  resumeSwimming();
  const figure = document.getElementById('pet-figure');
  if(figure) figure.style.filter = getDisplayFilter();
  startWanderLoop();
}

function setFacing(left){
  facingLeft = left;
  document.getElementById('pet-facing').style.transform = left ? 'scaleX(-1)' : 'scaleX(1)';
}

function trackDirection(){
  requestAnimationFrame(trackDirection);
  if(busy || isTurning || isResting) return;
  const swimmer = document.getElementById('pet-swimmer');
  if(!swimmer) return;
  const currentLeft = swimmer.getBoundingClientRect().left;
  if(lastLeftPx === null){ lastLeftPx = currentLeft; return; }
  const delta = currentLeft - lastLeftPx;
  lastLeftPx = currentLeft;
  if(Math.abs(delta) < 0.15) return;
  const movingLeft = delta < 0;
  if(movingLeft !== facingLeft){
    triggerTurn(movingLeft);
  }
}

function triggerTurn(newFacingLeft){
  isTurning = true;
  pauseSwimming();
  const figure = document.getElementById('pet-figure');
  const pack = getColorPack();
  let i = 0;

  if(pack.turnFrames){
    figure.style.filter = 'none';
    const seq = pack.turnFrames;
    const midpoint = Math.floor(seq.length / 2);
    const iv = setInterval(() => {
      figure.src = seq[i];
      if(i === midpoint){
        setFacing(newFacingLeft);
      }
      i += 1;
      if(i >= seq.length){
        clearInterval(iv);
        setFacing(newFacingLeft);
        resumeSwimming();
        lastLeftPx = null;
        isTurning = false;
      }
    }, 220);
    return;
  }

  const midpoint = Math.floor(TURN_SEQUENCE.length / 2);
  const iv = setInterval(() => {
    figure.style.filter = getDisplayFilter();
    figure.src = FRAMES[TURN_SEQUENCE[i]];
    if(i === midpoint){
      setFacing(newFacingLeft);
    }
    i += 1;
    if(i >= TURN_SEQUENCE.length){
      clearInterval(iv);
      setFacing(newFacingLeft);
      resumeSwimming();
      lastLeftPx = null;
      isTurning = false;
    }
  }, 150);
}

function pauseSwimming(){
  const swimmer = document.getElementById('pet-swimmer');
  const habitat = document.getElementById('habitat');
  const habRect = habitat.getBoundingClientRect();
  const swimmerRect = swimmer.getBoundingClientRect();
  const curLeftPct = ((swimmerRect.left + swimmerRect.width / 2 - habRect.left) / habRect.width) * 100;
  const curTopPct = ((swimmerRect.top + swimmerRect.height / 2 - habRect.top) / habRect.height) * 100;
  swimmer.style.transition = 'none';
  swimmer.style.left = curLeftPct + '%';
  swimmer.style.top = curTopPct + '%';
  document.getElementById('pet-turn').style.animationPlayState = 'paused';
}
function resumeSwimming(){
  document.getElementById('pet-turn').style.animationPlayState = 'running';
}

function playEatSequence(onDone){
  busy = true;
  pauseSwimming();
  const figure = document.getElementById('pet-figure');
  const pack = getColorPack();

  if(pack.eatFrame){
    figure.style.filter = 'none';
    figure.src = pack.eatFrame;
    setTimeout(() => {
      resumeSwimming();
      busy = false;
      if(onDone) onDone();
    }, 1700);
    return;
  }

  let i = 0;
  const iv = setInterval(() => {
    figure.style.filter = getDisplayFilter();
    figure.src = FRAMES[EAT_SEQUENCE[i]];
    i += 1;
    if(i >= EAT_SEQUENCE.length){
      clearInterval(iv);
      setTimeout(() => {
        resumeSwimming();
        busy = false;
        if(onDone) onDone();
      }, 450);
    }
  }, 260);
}

function playBump(toyEl){
  const habitat = document.getElementById('habitat');
  return new Promise(resolve => {
    const toyLeft = 30 + Math.random() * 40;
    const toyTop = 34 + Math.random() * 32;
    toyEl.style.left = toyLeft + '%';
    toyEl.style.top = toyTop + '%';
    toyEl.style.opacity = '0';
    toyEl.style.transform = 'translate(-50%,-50%) scale(0.6)';
    habitat.appendChild(toyEl);

    requestAnimationFrame(() => {
      toyEl.style.transition = 'opacity .4s ease, transform .4s ease';
      toyEl.style.opacity = '1';
      toyEl.style.transform = 'translate(-50%,-50%) scale(1)';
    });

    setTimeout(() => {
      const swimmer = document.getElementById('pet-swimmer');
      const turner = document.getElementById('pet-turn');
      const figure = document.getElementById('pet-figure');
      const habRect = habitat.getBoundingClientRect();
      const swimmerRect = swimmer.getBoundingClientRect();
      const curLeftPct = ((swimmerRect.left + swimmerRect.width / 2 - habRect.left) / habRect.width) * 100;
      const curTopPct = ((swimmerRect.top + swimmerRect.height / 2 - habRect.top) / habRect.height) * 100;

      turner.style.animationPlayState = 'paused';
      swimmer.style.transition = 'none';
      swimmer.style.left = curLeftPct + '%';
      swimmer.style.top = curTopPct + '%';
      void swimmer.offsetWidth;

      const dx = toyLeft - curLeftPct;
      const dy = toyTop - curTopPct;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const dirX = dx / dist;
      const dirY = dy / dist;

      setFacing(dirX < 0);

      const noseGap = 7;
      const approachLeft = toyLeft - dirX * noseGap;
      const approachTop = toyTop - dirY * noseGap;

      swimmer.style.transition = 'left 900ms ease-in-out, top 900ms ease-in-out';
      swimmer.style.left = approachLeft + '%';
      swimmer.style.top = approachTop + '%';

      setTimeout(() => {
        setHappyFrame(figure);
        figure.classList.remove('bounce'); void figure.offsetWidth; figure.classList.add('bounce');

        const knockDist = 28 + Math.random() * 16;
        const newLeft = Math.max(10, Math.min(90, toyLeft + dirX * knockDist));
        const newTop = Math.max(20, Math.min(78, toyTop + dirY * knockDist));
        const spin = Math.round((Math.random() * 2 - 1) * 200);
        toyEl.style.transition = 'left 1s cubic-bezier(.22,.8,.3,1), top 1s cubic-bezier(.22,.8,.3,1), transform 1s ease';
        toyEl.style.left = newLeft + '%';
        toyEl.style.top = newTop + '%';
        toyEl.style.transform = `translate(-50%,-50%) rotate(${spin}deg)`;
      }, 950);

      setTimeout(() => {
        turner.style.animationPlayState = 'running';
      }, 2000);

      setTimeout(() => {
        toyEl.style.transition = 'opacity .5s ease';
        toyEl.style.opacity = '0';
      }, 2600);
      setTimeout(() => { toyEl.remove(); resolve(); }, 3100);
    }, 500);
  });
}

function spawnSandPoof(left, top){
  const habitat = document.getElementById('habitat');
  const colors = ['#D9B98A', '#C89B6A', '#E0C79A', '#B98A57'];
  for(let i = 0; i < 9; i++){
    const p = document.createElement('div');
    p.className = 'sand-poof';
    const angle = Math.random() * Math.PI - Math.PI;
    const dist = 8 + Math.random() * 14;
    const dx = Math.cos(angle) * dist;
    const dy = -Math.abs(Math.sin(angle) * dist) - 6;
    p.style.left = left + '%';
    p.style.top = top + '%';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--dy', dy + 'px');
    const size = (3 + Math.random() * 4) + 'px';
    p.style.width = size;
    p.style.height = size;
    habitat.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

function playBury(toyEl){
  const habitat = document.getElementById('habitat');
  return new Promise(resolve => {
    const left = 30 + Math.random() * 40;
    const top = 78;
    toyEl.style.left = left + '%';
    toyEl.style.top = top + '%';
    toyEl.style.transform = 'translate(-50%,-20%) scale(0.5)';
    toyEl.style.opacity = '0';
    habitat.appendChild(toyEl);

    setTimeout(() => {
      const swimmer = document.getElementById('pet-swimmer');

      const figure = document.getElementById('pet-figure');
      const habRect = habitat.getBoundingClientRect();
      const swimmerRect = swimmer.getBoundingClientRect();
      const curLeftPct = ((swimmerRect.left + swimmerRect.width / 2 - habRect.left) / habRect.width) * 100;
      const curTopPct = ((swimmerRect.top + swimmerRect.height / 2 - habRect.top) / habRect.height) * 100;

      turner.style.animationPlayState = 'paused';
      swimmer.style.transition = 'none';
      swimmer.style.left = curLeftPct + '%';
      swimmer.style.top = curTopPct + '%';

        figure.style.transition = 'transform .25s ease';

      }, 1200);

      setTimeout(() => {
        figure.style.transform = 'translateY(6px) rotate(6deg)';
        spawnSandPoof(left, top - 6);
        toyEl.style.transition = 'transform .8s cubic-bezier(.34,1.56,.64,1), opacity .6s ease';
        toyEl.style.transform = 'translate(-50%,-50%) scale(1)';

      }, 1450);

      setTimeout(() => {
        figure.style.transform = 'translateY(0) rotate(0deg)';
      }, 1700);

      setTimeout(() => {
        figure.style.transform = '';
        figure.style.transition = '';
        turner.style.animationPlayState = 'running';
      }, 2200);

      setTimeout(() => {
        toyEl.style.transition = 'opacity .5s ease';
        toyEl.style.opacity = '0';
      }, 2400);
      setTimeout(() => { toyEl.remove(); resolve(); }, 2900);
    }, 500);
  });
}

function playRide(toyEl){
  return new Promise(resolve => {
    const swimmer = document.getElementById('pet-swimmer');
    const turner = document.getElementById('pet-turn');
    isRiding = true;
    toyEl.classList.add('ride-toy');
    swimmer.insertBefore(toyEl, swimmer.firstChild);
    toyEl.style.opacity = '0';
    toyEl.style.animationPlayState = 'paused';
    turner.style.animationPlayState = 'paused';
    requestAnimationFrame(() => {
      toyEl.style.transition = 'opacity .4s ease';
      toyEl.style.opacity = '1';
    });
    setHappyFrame(document.getElementById('pet-figure'));

    setTimeout(() => {
      toyEl.style.transition = 'opacity .5s ease';
      toyEl.style.opacity = '0';
    }, 4200);
    setTimeout(() => {
      isRiding = false;
      turner.style.animationPlayState = 'running';
      toyEl.remove();
      resolve();
    }, 4700);
  });
}

function playToyAnimation(toy, onDone){
  busy = true;
  const isRide = (toy.kind === 'ride');
  if(!isRide) pauseSwimming();
  const toyEl = document.createElement('img');
  toyEl.className = 'toy-el toy-' + toy.key;
  toyEl.src = toy.img;
  toyEl.alt = toy.key;

  let behaviorPromise;
  if(toy.kind === 'bump') behaviorPromise = playBump(toyEl);
  else if(toy.kind === 'bury') behaviorPromise = playBury(toyEl);
  else if(toy.kind === 'hang') behaviorPromise = playHang(toyEl);
  else behaviorPromise = playRide(toyEl);

  behaviorPromise.then(() => {
    if(!isRide) resumeSwimming();
    busy = false;
    if(onDone) onDone();
  });
}

      pellet.style.opacity = '0';
      pellet.style.transform += ' scale(0.4)';
      setTimeout(() => pellet.remove(), 550);
    }, 1450);
  }, delay);
}

function dropPellets(onDone){
  dropPellet(0);
  dropPellet(180);
  dropPellet(360);
  setTimeout(() => playEatSequence(onDone), 1650);
}

async function addXP(amount){
  if(!state || busy) return false;
  amount = Math.floor(Number(amount));
  if(!Number.isFinite(amount) || amount <= 0) return false;

  const wasSick = getHealthStatus() === 'sick';
  state.lastFedAt = Date.now();
  state.timesFed = (state.timesFed || 0) + 1;

  const oldXP = state.totalXP || 0;
  const newXP = oldXP + amount;
  state.totalXP = newXP;
  const oldLevel = Math.floor(oldXP / LEVEL_XP);
  const newLevel = Math.floor(newXP / LEVEL_XP);
  const leveledUp = newLevel > oldLevel;

  const newStageIdx = stageIndexFor(newLevel);
  const milestoneReached = newStageIdx > (state.unlockedStageIndex || 0);

  // Once fully grown, the axolotl stops leveling up in size, but every 4
  // more levels still unlocks a new decoration - and every 4th of those
  // decoration unlocks, the tank itself gets a bit bigger.
  let postMaxMilestone = false;
  const maxStageIdx = STAGES.length - 1;
  if(!milestoneReached && newStageIdx === maxStageIdx){
    const maxStage = STAGES[maxStageIdx];
    const pastMax = newLevel - maxStage.min;
    if(pastMax > 0){
      const intervalsPassed = Math.floor(pastMax / POST_MAX_LEVEL_INTERVAL);
      if(intervalsPassed > (state.postMaxMilestoneCount || 0)){
        state.postMaxMilestoneCount = intervalsPassed;
        if(intervalsPassed % TANK_GROWTH_EVERY === 0){
          state.tankLevel = (state.tankLevel || 0) + 1;
        }
        const placedCount = (state.decorations || []).length;
        if(placedCount < MAX_DECOR){
          postMaxMilestone = true;
        }
      }
    }
  }

  await saveState();
  paintHabitat();
  if(wasSick) wakeFromSickness();

  // Leveling up means the pet eats, then always gets a toy right after -
  // chained so the two animations play in sequence instead of colliding.
  // Any decoration/color choice waits until that whole sequence is done
  // playing, instead of popping up over it and blocking the view.
  if(leveledUp){
    busy = true;
    dropPellets(() => {
      const toy = pickNextToy();
      state.toysGiven = (state.toysGiven || 0) + 1;
      playToyAnimation(toy, () => {
        saveState();
        paintHabitat();
        if(milestoneReached){
          showMilestoneModal(newStageIdx);
        } else if(postMaxMilestone){
          showMilestoneModal('postmax');
        } else {
          setTimeout(runFeeds, 900);
        }
      });
    });
  }
  return true;
}
// ---------- Companion Keep bridge (Nov 4) ----------
// Companion Keep sends: the saved axolotl, how many feed days the student has earned (good), today's progress and health.
// Feeds play one at a time (eat, then a toy, then any reward), and each one is saved.
let ckGood = 0, ckFrom = '', ckResetAt = 0, ckToday = { date: '', good: false, xp: 0, goal: 120, rows: [] }, ckReady = false;
function modalOpen(){ return document.getElementById('milestone-overlay').style.display === 'flex' || !!placingItemKey; }
function runFeeds(){
  if(!state || !state.name || busy || modalOpen()) return;
  if(ckGood - (state.fed || 0) <= 0) return;
  state.fed = (state.fed || 0) + 1;
  addXP(LEVEL_XP);
}
function paintCK(isMaxStage){
  const t = ckToday || {}, waiting = Math.max(0, ckGood - ((state && state.fed) || 0));
  const chip = (txt, ok) => '<span class="ck-chip' + (ok ? ' ok' : '') + '">' + txt + (ok ? ' \u2705' : '') + '</span>';
  document.getElementById('ck-today').innerHTML =
    '<p class="ck-rule">\u{1F37D}\uFE0F ' + escH(state.name) + ' eats once a day when you hit <b>' + t.goal + ' XP</b> and <b>25 in Math, Reading and Language</b>.</p>' +
    '<div class="ck-chips"><b style="margin-right:4px;">Today:</b>' + chip(Math.round(t.xp || 0) + ' / ' + t.goal + ' XP', (t.xp || 0) >= t.goal) +
    (t.rows || []).map(r => chip(escH(r.name) + ' ' + Math.round(r.have) + ' / ' + r.need, r.have >= r.need)).join('') + '</div>' +
    (t.good ? '<div class="ck-fed">\u2728 ' + escH(state.name) + ' got fed today!</div>' : '') +
    (waiting > 0 && busy ? '<div class="ck-fed">' + waiting + ' more feed' + (waiting === 1 ? '' : 's') + ' coming\u2026</div>' : '');
  const grown = document.getElementById('ck-grown-box');
  if(isMaxStage && !state.keep){
    grown.innerHTML = '<div class="ck-grown"><h3>\u{1F389} ' + escH(state.name) + ' is fully grown!</h3><p>Keep raising ' + escH(state.name) + ' (a new decoration every ' + POST_MAX_LEVEL_INTERVAL + ' feeds), or start over with a new baby axolotl. ' + escH(state.name) + ' will go in your album.</p>' +
      '<div class="ck-row"><button class="btn" id="ck-keep">Keep ' + escH(state.name) + '</button><button class="btn ghost" id="ck-new">\u{1F95A} Start a new baby</button></div></div>';
  } else if(isMaxStage){
    grown.innerHTML = '<div class="ck-new"><button class="btn ghost" id="ck-new">\u{1F95A} Start a new baby axolotl</button></div>';
  } else grown.innerHTML = '';
  const k = document.getElementById('ck-keep'); if(k) k.onclick = () => { state.keep = true; saveState(); paintHabitat(); };
  const n = document.getElementById('ck-new'); if(n) n.onclick = () => askNewBaby(n);
  document.getElementById('ck-album').innerHTML = albumHTML();
}
function askNewBaby(btn){
  if(busy || modalOpen()) return;
  if(!btn.dataset.sure){ btn.dataset.sure = '1'; btn.textContent = 'Tap again to say goodbye to ' + state.name; return; }
  newBaby();
}
// Start over: the grown axolotl goes in the album, the new baby counts feeds from today on
// (today's feed already went to the grown one if today was a good day).
function newBaby(){
  const past = (state.past || []).concat([{ name: state.name, paletteIndex: state.paletteIndex || 0, level: Math.floor((state.totalXP || 0) / LEVEL_XP), at: ckToday.date }]).slice(-20);
  const keepReset = state.resetAt || ckResetAt;
  resetPet(true);
  state = { past, since: ckToday.date, fed: ckToday.good ? 1 : 0, resetAt: keepReset };
  saveState();
  renderPickScreen();
}
function postHeight(){
  try{ parent.postMessage({ type: 'ck-height', h: Math.ceil(document.documentElement.scrollHeight) }, location.origin); }catch(e){}
}
window.addEventListener('message', (evt) => {
  if(evt.source !== parent || evt.origin !== location.origin) return;
  const d = evt.data || {};
  if(d.type !== 'ck-data') return;
  ckGood = Number(d.good) || 0; ckFrom = d.from || ''; ckToday = d.today || ckToday; ckHealth = d.health || 'ok';
  const resetAt = Number(d.resetAt) || 0;
  if(!ckReady){
    ckReady = true; ckResetAt = resetAt;
    state = d.state ? JSON.parse(JSON.stringify(d.state)) : null;
    if(state && (Number(state.resetAt) || 0) < resetAt){ state = { past: state.past || [], since: ckToday.date, fed: ckToday.good ? 1 : 0, resetAt }; saveState(); }
    if(state) fillState();
    if(state && state.name){ renderHabitatScreen(); setTimeout(runFeeds, 1200); }
    else renderPickScreen();
    postHeight();
    return;
  }
  // the teacher started this student over
  if(state && (Number(state.resetAt) || 0) < resetAt){ ckResetAt = resetAt; resetPet(true); state = { past: (d.state && d.state.past) || [], since: ckToday.date, fed: ckToday.good ? 1 : 0, resetAt }; saveState(); renderPickScreen(); return; }
  if(state && state.name){ if(!busy && !dragCtx && !modalOpen()) paintHabitat(); runFeeds(); }
});

function showMilestoneModal(stageIdx){
  pendingMilestoneStageIdx = stageIdx;
  const isPostMax = (stageIdx === 'postmax');
  const stage = isPostMax ? STAGES[STAGES.length - 1] : STAGES[stageIdx];
  document.getElementById('milestone-heading').textContent = isPostMax
    ? `${state.name} found something new!`
    : `${state.name} leveled up to ${stage.label}!`;

  const colorChoices = document.getElementById('color-choices');
  const furnitureChoices = document.getElementById('furniture-choices');
  const subtext = document.getElementById('milestone-subtext');
  const isColorMilestone = !isPostMax && (stage.label === 'Growing');

  colorChoices.style.display = isColorMilestone ? 'grid' : 'none';
  furnitureChoices.style.display = isColorMilestone ? 'none' : 'grid';
  colorChoices.innerHTML = '';
  furnitureChoices.innerHTML = '';

  if(isColorMilestone){
    subtext.textContent = 'Pick a new color for the class pet:';
    PALETTES.forEach((pack, idx) => {
      if(idx === 0) return;
      const btn = document.createElement('button');
      btn.className = 'color-swatch-btn';
      const thumb = pack.happyFrame || FRAMES[TOY_FRAME];
      const thumbFilter = pack.happyFrame ? 'none' : pack.filter;
      btn.innerHTML = `<img src="${thumb}" style="filter:${thumbFilter}"><span>${pack.label}</span>`;
      btn.addEventListener('click', () => resolveMilestone(idx));
      colorChoices.appendChild(btn);
    });
  } else {
    subtext.textContent = 'Pick a decoration for the tank:';
    const placed = state.decorations || [];
    const available = FURNITURE_CATALOG.filter(item => !placed.includes(item.key));
    const hasRoom = placed.length < MAX_DECOR;
    (hasRoom ? available : []).forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'color-swatch-btn';
      btn.innerHTML = `<img src="${item.img}"><span>${item.label}</span>`;
      if(item.variants){
        btn.addEventListener('click', () => showVariantChoices(item));
      } else {
        btn.addEventListener('click', () => beginPlacement(item.key));
      }
      furnitureChoices.appendChild(btn);
    });
  }

  document.getElementById('milestone-overlay').style.display = 'flex';
}

function showVariantChoices(item){
  const subtext = document.getElementById('milestone-subtext');
  const furnitureChoices = document.getElementById('furniture-choices');
  subtext.textContent = `Pick a color for the ${item.label}:`;
  furnitureChoices.innerHTML = '';
  item.variants.forEach(variant => {
    const btn = document.createElement('button');
    btn.className = 'color-swatch-btn';
    btn.innerHTML = `<img src="${variant.img}"><span>${variant.label}</span>`;
    btn.addEventListener('click', () => beginPlacement(item.key, variant.key));
    furnitureChoices.appendChild(btn);
  });
}

// Palette (color) milestone rewards resolve immediately; decoration rewards
// go through the placement flow below so the user can choose where it sits.
async function resolveMilestone(choice){
  state.paletteIndex = choice;
  if(typeof pendingMilestoneStageIdx === 'number'){
    state.unlockedStageIndex = pendingMilestoneStageIdx;
  }
  pendingMilestoneStageIdx = null;
  document.getElementById('milestone-overlay').style.display = 'none';
  await saveState();
  paintHabitat();
  setTimeout(runFeeds, 900);
}

function decorHeightFor(kind){
  return kind === 'plant' ? (24 + Math.random() * 10) : (30 + Math.random() * 12);
}

// Drag-to-position for decorations. Works for both a brand-new item (dragged
// from a floating preview right after being chosen) and an already-placed
// one (dragged directly). Pointer Events unify mouse and touch so the same
// code handles both.
let dragCtx = null;

function attachDragHandlers(div, key, isNew){
  div.addEventListener('pointerdown', (evt) => {
    if(dragCtx) return;
    evt.preventDefault();
    dragCtx = {
      key, div, isNew,
      pointerId: evt.pointerId,
      leftPct: parseFloat(div.style.left) || 50,
      topPct: parseFloat(div.style.top) || 50
    };
    try{ div.setPointerCapture(evt.pointerId); }catch(e){}
    div.classList.add('dragging');
    if(isNew){
      document.getElementById('placement-banner-text').textContent = 'Drag, then let go to drop it';
    }
    div.addEventListener('pointermove', handleDragMove);
    div.addEventListener('pointerup', handleDragEnd);
    div.addEventListener('pointercancel', handleDragEnd);
  });
}

function handleDragMove(evt){
  if(!dragCtx) return;
  const habitat = document.getElementById('habitat');
  const habRect = habitat.getBoundingClientRect();
  if(!habRect.width) return;
  const divRect = dragCtx.div.getBoundingClientRect();
  const halfWidthPct = (divRect.width / 2 / habRect.width) * 100;
  const halfHeightPct = (divRect.height / 2 / habRect.height) * 100;
  const margin = 7;
  const minLeft = Math.min(halfWidthPct + margin, 50);
  const maxLeft = Math.max(100 - halfWidthPct - margin, 50);
  let leftPct = ((evt.clientX - habRect.left) / habRect.width) * 100;
  leftPct = Math.min(maxLeft, Math.max(minLeft, leftPct));
  dragCtx.div.style.left = leftPct + '%';
  dragCtx.leftPct = leftPct;

  // Free vertical movement too, just kept from crossing above the waterline
  // or below the tank's own floor.
  const minTop = WATER_SURFACE_PCT + halfHeightPct;
  const maxTop = Math.max(minTop, 96 - halfHeightPct);
  let topPct = ((evt.clientY - habRect.top) / habRect.height) * 100;
  topPct = Math.min(maxTop, Math.max(minTop, topPct));
  dragCtx.div.style.top = topPct + '%';
  dragCtx.topPct = topPct;
}

async function handleDragEnd(evt){
  if(!dragCtx) return;
  const { key, div, isNew, leftPct, topPct, pointerId } = dragCtx;
  try{ div.releasePointerCapture(pointerId); }catch(e){}
  div.removeEventListener('pointermove', handleDragMove);
  div.removeEventListener('pointerup', handleDragEnd);
  div.removeEventListener('pointercancel', handleDragEnd);
  div.classList.remove('dragging');
  dragCtx = null;

  if(isNew){
    finishNewPlacement(key, placingVariantKey, leftPct, topPct);
  } else {
    if(!state.decorPositions) state.decorPositions = {};
    const existing = state.decorPositions[key] || {};
    state.decorPositions[key] = { left: leftPct + '%', top: topPct + '%', height: existing.height };
    await saveState();
    paintHabitat();
  }
}

function beginPlacement(key, variantKey){
  placingItemKey = key;
  placingVariantKey = variantKey || null;
  document.getElementById('milestone-overlay').style.display = 'none';

  const item = FURNITURE_CATALOG.find(f => f.key === key);
  const variant = item.variants && item.variants.find(v => v.key === variantKey);
  const decorLayer = document.getElementById('decor-layer');
  const div = document.createElement('div');
  div.className = 'decor-item new-preview' + (item.kind === 'plant' ? ' decor-sway' : '');
  div.style.left = '50%';
  const heightPct = decorHeightFor(item.kind);
  div.style.height = heightPct + '%';
  div.style.top = defaultTopPercentFor(50, 0, heightPct) + '%';
  const img = document.createElement('img');
  img.alt = item.label;
  img.onload = () => refineNewPreviewPosition(div, img);
  img.src = variant ? variant.img : item.img;
  div.appendChild(img);
  decorLayer.appendChild(div);
  attachDragHandlers(div, key, true);
  newPlacementPreview = div;

  document.getElementById('placement-banner-text').textContent = 'Drag it to where you\'d like it';
  document.getElementById('placement-center-btn').textContent = 'Drop it in the middle';
  document.getElementById('placement-banner').classList.add('show');
}

async function finishNewPlacement(key, variantKey, leftPct, topPct){
  document.getElementById('placement-banner').classList.remove('show');
  if(newPlacementPreview){ newPlacementPreview.remove(); newPlacementPreview = null; }

  placingItemKey = null;
  placingVariantKey = null;
  if(!key || !state) return;

  const item = FURNITURE_CATALOG.find(f => f.key === key);
  if(!state.decorations) state.decorations = [];
  if(!state.decorPositions) state.decorPositions = {};
  if(!state.decorations.includes(key) && state.decorations.length < MAX_DECOR){
    state.decorations.push(key);
    if(variantKey){
      if(!state.decorVariants) state.decorVariants = {};
      state.decorVariants[key] = variantKey;
    }
    const height = decorHeightFor(item && item.kind);
    const top = topPct != null ? topPct : defaultTopPercentFor(leftPct, 0, height);
    state.decorPositions[key] = { left: leftPct + '%', top: top + '%', height: height + '%' };
  }
  if(typeof pendingMilestoneStageIdx === 'number'){
    state.unlockedStageIndex = pendingMilestoneStageIdx;
  }
  pendingMilestoneStageIdx = null;
  await saveState();
  paintHabitat();
  setTimeout(runFeeds, 900);
}

function cancelPlacementMode(){
  if(newPlacementPreview){ newPlacementPreview.remove(); newPlacementPreview = null; }
  document.getElementById('placement-banner').classList.remove('show');
  placingItemKey = null;
  placingVariantKey = null;
  dragCtx = null;
}

async function resetPet(){
  state = null;
  if(swimTimer){ clearInterval(swimTimer); swimTimer = null; }
  if(wanderTimer){ clearTimeout(wanderTimer); wanderTimer = null; }
  busy = false;
  isTurning = false;
  isRiding = false;
  isResting = false;
  facingLeft = false;
  lastLeftPx = null;
  pendingMilestoneStageIdx = null;
  currentStage = null;
  const appEl = document.querySelector('.app');
  if(appEl) appEl.style.maxWidth = TANK_BASE_MAX_WIDTH + 'px';
  cancelPlacementMode();
  document.getElementById('pet-figure').removeAttribute('src');
  document.getElementById('pet-figure').style.filter = 'none';
  document.getElementById('pet-facing').style.transform = 'scaleX(1)';
  const swimmerReset = document.getElementById('pet-swimmer');
  swimmerReset.style.transition = 'none';
  swimmerReset.style.left = '22%';
  swimmerReset.style.top = '55%';
  document.getElementById('decor-layer').innerHTML = '';
  document.getElementById('milestone-overlay').style.display = 'none';
  document.getElementById('health-tag').style.display = 'none';
  document.getElementById('pet-name-input').value = '';
  updateConfirmBtn();
}

async function init(){
  document.getElementById('tank-bg').src = TANK_BG;
  document.getElementById('sand-bed-img').src = SAND_BED;
  document.getElementById('pet-name-input').addEventListener('input', updateConfirmBtn);
  document.getElementById('confirm-btn').addEventListener('click', confirmPet);
  document.getElementById('placement-center-btn').addEventListener('click', (evt) => {
    evt.stopPropagation();
    if(placingItemKey){
      finishNewPlacement(placingItemKey, placingVariantKey, 50);
    }
  });
  // the page grows to fit, so Companion Keep can size its frame
  try{ new ResizeObserver(postHeight).observe(document.body); }catch(e){ setInterval(postHeight, 1000); }
  parent.postMessage({ type: 'ck-ready' }, location.origin);
  setInterval(() => {
    if(state && state.name && !busy && !dragCtx && !modalOpen()) paintHabitat();
  }, 60000);
}
init();
</script>
